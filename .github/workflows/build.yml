name: CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build & Verify Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set legacy-peer-deps true
          echo "legacy-peer-deps=true" >> .npmrc

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trust-wallet-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Gradle Wrapper
        id: check_gradle
        run: |
          if [ -f "./gradlew" ]; then
            echo "has_gradle=true" >> $GITHUB_OUTPUT
            echo "Gradle wrapper found: will proceed with Android build."
          else
            echo "has_gradle=false" >> $GITHUB_OUTPUT
            echo "Gradle wrapper not found: skipping Android build."
          fi

      - name: Download Web Dist
        if: steps.check_gradle.outputs.has_gradle == 'true'
        uses: actions/download-artifact@v4
        with:
          name: trust-wallet-web-dist
          path: dist

      - name: Copy Web Dist to Android Assets
        if: steps.check_gradle.outputs.has_gradle == 'true'
        run: |
          mkdir -p app/src/main/assets/dist
          cp -rf dist/* app/src/main/assets/dist/ 2>/dev/null || true

      - name: Set up JDK 17
        if: steps.check_gradle.outputs.has_gradle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        if: steps.check_gradle.outputs.has_gradle == 'true'
        run: chmod +x gradlew

      - name: Build Android Debug APK
        if: steps.check_gradle.outputs.has_gradle == 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        if: steps.check_gradle.outputs.has_gradle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trust-wallet-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
